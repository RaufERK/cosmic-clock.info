# Local PostgreSQL for Cosmic Clock development.
# Host port 5433 — avoids clash with other local Postgres on 5432.

services:
  postgres:
    image: postgres:18
    container_name: cosmic-clock-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: cosmic_clock
      POSTGRES_PASSWORD: cosmic_clock
      POSTGRES_DB: cosmic_clock
    volumes:
      # PG 18 image keeps data in /var/lib/postgresql/18/docker: mount the parent. New volume name,
      # because the old PG 16 volume (cosmic_clock_pgdata) cannot be opened by PG 18.
      - cosmic_clock_pg18data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosmic_clock -d cosmic_clock"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cosmic_clock_pg18data:
