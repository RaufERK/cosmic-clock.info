<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Full-bleed disc -->
  <circle cx="16" cy="16" r="16" fill="#0a0614"/>
  <circle cx="16" cy="16" r="15.2" stroke="#7c3aed" stroke-width="1.8" fill="#12081f"/>
  <!-- Ticks 12, 3, 6, 9 — closer to edge -->
  <g stroke="#c4b5fd" stroke-opacity="0.95" stroke-width="1.6" stroke-linecap="round">
    <line x1="16" y1="2.2" x2="16" y2="5.8"/>
    <line x1="29.8" y1="16" x2="26.2" y2="16"/>
    <line x1="16" y1="29.8" x2="16" y2="26.2"/>
    <line x1="2.2" y1="16" x2="5.8" y2="16"/>
  </g>
  <!-- ~10:00 hour -->
  <line x1="16" y1="16" x2="6.5" y2="9.2" stroke="#60a5fa" stroke-width="2.8" stroke-linecap="round"/>
  <!-- ~2:00 minute -->
  <line x1="16" y1="16" x2="25.5" y2="9.2" stroke="#c084fc" stroke-width="2" stroke-linecap="round"/>
  <circle cx="16" cy="16" r="2.4" fill="#fdf4ff"/>
  <circle cx="16" cy="16" r="1.2" fill="#6b0f2a"/>
</svg>
