# /etc/nginx/sites-available/cosmic-clock.info
# Step 1: HTTP only (certbot will add SSL)

server {
    server_name cosmic-clock.info www.cosmic-clock.info;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Umami tracker (first-party). Dashboard: stats.cosmic-clock.info (PM2 umami :3030).
    location = /ua.js {
        proxy_pass http://127.0.0.1:3030/script.js;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/send {
        proxy_pass http://127.0.0.1:3030/api/send;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3060;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600;
        proxy_send_timeout 600;
        proxy_buffering off;
    }

    access_log /var/log/nginx/cosmic_clock_info_access.log;
    error_log  /var/log/nginx/cosmic_clock_info_error.log;

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/cosmic-clock.info/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/cosmic-clock.info/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = www.cosmic-clock.info) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = cosmic-clock.info) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name cosmic-clock.info www.cosmic-clock.info;
    return 404; # managed by Certbot




}