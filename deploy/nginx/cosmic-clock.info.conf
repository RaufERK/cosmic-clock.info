# /etc/nginx/sites-available/cosmic-clock.info
# Enable after DNS A/AAAA for cosmic-clock.info (+ www) → 185.200.178.73
# Then: certbot --nginx -d cosmic-clock.info -d www.cosmic-clock.info

# 1) HTTP: ACME + redirect → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name cosmic-clock.info www.cosmic-clock.info;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2) HTTPS: reverse proxy → Next.js on 127.0.0.1:3060
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cosmic-clock.info www.cosmic-clock.info;

    # Filled by Certbot after DNS is live:
    # ssl_certificate     /etc/letsencrypt/live/cosmic-clock.info/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/cosmic-clock.info/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    proxy_http_version 1.1;
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  https;

    location / {
        proxy_pass http://127.0.0.1:3060;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600;
        proxy_send_timeout 600;
        proxy_buffering off;
    }

    location ^~ /_next/static/ {
        proxy_pass http://127.0.0.1:3060;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /_next/image {
        proxy_pass http://127.0.0.1:3060;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/xml text/plain image/svg+xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/cosmic_clock_info_access.log;
    error_log  /var/log/nginx/cosmic_clock_info_error.log;
}
