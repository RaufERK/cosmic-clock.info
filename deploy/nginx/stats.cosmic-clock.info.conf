# Umami dashboard — enable after DNS A for stats.cosmic-clock.info → 185.200.178.73
# Then: certbot --nginx -d stats.cosmic-clock.info
#
# App: PM2 `umami` on 127.0.0.1:3030
# Code: /home/appuser/apps/umami
# Env:  /home/appuser/apps/umami-shared/.env

server {
    listen 80;
    listen [::]:80;
    server_name stats.cosmic-clock.info;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/stats_cosmic_clock_info_access.log;
    error_log  /var/log/nginx/stats_cosmic_clock_info_error.log;
}
